<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | VitraFlow</title>
  <link rel="icon" href="/assets/icons/vitraflow-symbol.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/login.js"></script>
</head>
<body class="access-page">
  <main class="panel access-card">
    <img class="access-logo" src="/assets/images/vitraflow-logo.png" alt="VitraFlow" width="778" height="264">
    <h1 id="access-title">Entrar no painel</h1>
    <p class="muted access-note">Acesso demonstrativo. Use dados fictícios.</p>
    <div class="editor-groups access-switch" role="group" aria-label="Modo de acesso">
      <button class="button" type="button" data-access="login" aria-controls="login-form" aria-pressed="true">Entrar</button>
      <button class="button" type="button" data-access="register" aria-controls="register-form" aria-pressed="false">Criar conta</button>
    </div>
    <form class="stack" id="login-form" method="post">
      <label class="field">E-mail<input type="email" name="email" maxlength="160" autocomplete="username" required></label>
      <label class="field">Senha demonstrativa<input type="password" name="password" minlength="6" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Entrar no painel</button>
    </form>
    <form class="stack" id="register-form" method="post" hidden>
      <label class="field">Nome<input name="name" maxlength="80" autocomplete="name" required></label>
      <label class="field">E-mail<input type="email" name="email" maxlength="160" autocomplete="username" required></label>
      <label class="field">Senha demonstrativa<input type="password" name="password" minlength="6" placeholder="Pelo menos 6 caracteres" autocomplete="new-password" required></label>
      <button class="button primary" type="submit">Criar conta demonstrativa</button>
    </form>
    <p class="form-error access-error" id="access-error" role="alert" hidden></p>
  </main>
</body>
</html>
